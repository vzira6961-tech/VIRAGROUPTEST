<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة الانضمام - مجموعة فيرا</title>
    <!-- خط Cairo الفاخر من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.75);
            --accent-color: #7c3aed;
            --accent-glow: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-glow);
            margin: 30px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #d1d5db;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .radio-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .radio-option {
            flex: 1;
            min-width: 100px;
        }

        .radio-option input {
            display: none;
        }

        .radio-option label {
            display: block;
            text-align: center;
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        .radio-option input:checked + label {
            background: var(--accent-color);
            border-color: var(--accent-glow);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.4);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            background: linear-gradient(135deg, var(--accent-color), #9333ea);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(124, 58, 237, 0.5);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid var(--accent-glow);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
        }

        .modal-content h3 { font-size: 1.5rem; color: #a78bfa; margin-bottom: 10px; }
        .modal-content p { color: var(--text-muted); margin-bottom: 20px; }
        .modal-btn {
            background: var(--accent-color);
            color: #fff; border: none;
            padding: 10px 25px; border-radius: 10px;
            cursor: pointer; font-weight: 700;
        }

        .spinner {
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🔥 طلب انضمام أعظم</h1>
            <p>قم بملء البيانات التالية بدقة للانضمام لمجموعة فيرا</p>
        </div>

        <form id="veraForm">
            
            <!-- SECTION 1 -->
            <div class="section-title">👤 البيانات الأساسية</div>
            <div class="grid-2">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" name="name" required placeholder="أدخل اسمك">
                </div>
                <div class="form-group">
                    <label>العمر</label>
                    <input type="number" name="age" required placeholder="عمرك">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" name="email" required placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label>الأكلة المفضلة</label>
                    <input type="text" name="food" placeholder="وجبتك المفضلة">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>المادة المفضلة</label>
                    <input type="text" name="subject" placeholder="المادة الدراسية المفضلة">
                </div>
                <div class="form-group">
                    <label>الهواية</label>
                    <input type="text" name="hobby" placeholder="هوايتك المفضلة">
                </div>
            </div>

            <div class="form-group">
                <label>هل تعاني من أي أمراض صحية؟</label>
                <input type="text" name="health" placeholder="اكتب لا يوجد أو أذكر المرض">
            </div>

            <!-- SECTION 2 -->
            <div class="section-title">⚡ التقييم السريع</div>
            
            <div class="form-group">
                <label>مستعد للمغامرة؟</label>
                <div class="radio-group">
                    <div class="radio-option"><input type="radio" id="adv1" name="adventure" value="نعم" checked><label for="adv1">نعم</label></div>
                    <div class="radio-option"><input type="radio" id="adv2" name="adventure" value="لا"><label for="adv2">لا</label></div>
                    <div class="radio-option"><input type="radio" id="adv3" name="adventure" value="إلى حد ما"><label for="adv3">إلى حد ما</label></div>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>هل أنت شخص مجتهد؟</label>
                    <input type="text" name="diligent" placeholder="توصيف بسيط">
                </div>
                <div class="form-group">
                    <label>هل أنت سريع التفكير؟</label>
                    <input type="text" name="quick" placeholder="توصيف بسيط">
                </div>
            </div>

            <!-- SECTION 3 -->
            <div class="section-title">👑 أسئلة الانضمام الأعظم</div>

            <div class="grid-2">
                <div class="form-group">
                    <label>جاهز لقتال من أجل فيرا؟</label>
                    <input type="text" name="veraSide" placeholder="إجابتك">
                </div>
                <div class="form-group">
                    <label>جاهز لحمل لقب رائع؟</label>
                    <input type="text" name="veraTitle" placeholder="إجابتك">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>جاهز لدخول عالمه؟</label>
                    <input type="text" name="veraWorld" placeholder="إجابتك">
                </div>
                <div class="form-group">
                    <label>مستوى الولاء لديك</label>
                    <input type="text" name="veraLoyalty" placeholder="من 1 إلى 10 أو وصف">
                </div>
            </div>

            <div class="form-group">
                <label>مدى قدرتك على تحمل المسؤولية</label>
                <input type="text" name="veraResponsibility" placeholder="وصف قدرتك">
            </div>

            <!-- SECTION 4 -->
            <div class="section-title">✍️ الوصف الشخصي</div>
            <div class="form-group">
                <label>اكتب نبذة عن نفسك ولماذا تستحق الانضمام؟</label>
                <textarea name="essay" required placeholder="تحدث عن نفسك بكل حريّة..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span>إرسال طلب الانضمام</span> 🚀
            </button>
        </form>
    </div>

    <!-- Modal Success -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <h3>🎉 تم الإرسال بنجاح!</h3>
            <p>تم حفظ بياناتك وإرسال الإشعار فوراً إلى الإدارة.</p>
            <button class="modal-btn" onclick="closeModal()">رائع!</button>
        </div>
    </div>

    <script>
        // ========================================================
        // ⚙️ إعدادات الرابط والمفاتيح
        // ========================================================
        
        // 1. رابط الـ Google Apps Script الخاص بك 
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz4hZ0YbH_23wxj-nAu7YUoq9h6CGet-K6ha_LAexG65DBZFa6_cDB3I9OqUtgEEZjgQg/exec'; 

        // 2. مفتاح Web3Forms الخاص بك 
        const WEB3FORMS_KEY = '7ad2d708-8d3e-4c15-bc24-b1b2bf56c9a6'; 

        // ========================================================

        const form = document.getElementById('veraForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="spinner"></div> جاري الإرسال...';

            const formData = new FormData(form);
            const dataObj = Object.fromEntries(formData.entries());

            const fetchPromises = [];

            // 1. إرسال إلى Google Sheets باستخدام URLSearchParams لحل مشكلة الحظر
            if (GOOGLE_SCRIPT_URL) {
                const sheetData = new URLSearchParams(formData);
                fetchPromises.push(
                    fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: sheetData
                    })
                );
            }

            // 2. إرسال إيميل مباشر عبر Web3Forms
            if (WEB3FORMS_KEY) {
                const emailFormData = new FormData(form);
                emailFormData.append('access_key', WEB3FORMS_KEY);
                emailFormData.append('subject', '🔥 طلب انضمام جديد من: ' + (dataObj.name || 'مستخدم'));
                emailFormData.append('from_name', 'مجموعة فيرا');

                fetchPromises.push(
                    fetch('https://api.web3forms.com/submit', {
                        method: 'POST',
                        body: emailFormData
                    })
                );
            }

            try {
                await Promise.allSettled(fetchPromises);
                document.getElementById('successModal').style.display = 'flex';
                form.reset();
            } catch (err) {
                alert('حدث خطأ أثناء الإرسال، برجاء المحاولة لاحقاً.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>إرسال طلب الانضمام</span> 🚀';
            }
        });

        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
        }
    </script>
</body>
</html>
