<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجموعة فيرا | طلب الانضمام</title>
    <style>
        /* إعدادات عامة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #000000; /* أسود نقي */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
        }

        /* كرات الزجاج السائل المظلمة (Deep Black Liquid Blobs) */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            animation: moveBlobs 15s infinite alternate ease-in-out;
            opacity: 0.7;
        }
        .blob-1 { width: 400px; height: 400px; background: #0a0a0a; top: -10%; left: 5%; box-shadow: 0 0 120px #2e1065; } 
        .blob-2 { width: 500px; height: 500px; background: #050505; bottom: -15%; right: -5%; box-shadow: 0 0 150px #1e1b4b; }
        .blob-3 { width: 350px; height: 350px; background: #000000; top: 40%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 100px #312e81; }

        @keyframes moveBlobs {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -70px) scale(1.15); }
        }

        /* بطاقة الزجاج السائل */
        .glass-card {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9);
            color: #fff;
            transform: translateY(30px);
            opacity: 0;
            animation: slideUp 0.8s ease-out forwards;
            position: relative;
            z-index: 10;
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 34px;
            letter-spacing: 1.5px;
            background: linear-gradient(to right, #ffffff, #818cf8, #ffffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        p.subtitle {
            text-align: center;
            margin-bottom: 35px;
            color: #9ca3af;
            font-size: 15px;
        }

        /* شبكة النماذج المتقدمة */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .full-width {
            grid-column: span 2;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .glass-card { padding: 30px 20px; }
            h1 { font-size: 28px; }
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #e5e7eb;
            font-weight: 500;
        }
        
        .input-group input, .input-group select {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #6366f1;
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2), inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .input-group select option { background: #0f0f0f; color: #fff; padding: 10px; }

        /* زر الإرسال */
        .btn {
            grid-column: 1 / -1;
            width: 100%;
            padding: 18px;
            margin-top: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #4f46e5, #312e81);
            color: white;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(49, 46, 129, 0.5);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(79, 70, 229, 0.6);
            background: linear-gradient(135deg, #6366f1, #3730a3);
        }

        /* النوافذ المنبثقة (Pop-ups) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden;
            transition: all 0.4s ease;
            z-index: 1000;
        }

        .modal-content {
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            color: #fff;
            transform: scale(0.7) translateY(30px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 90%; max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }

        .modal-content h2 { margin-bottom: 15px; font-size: 26px; }
        .modal-content p { margin-bottom: 30px; font-size: 15px; color: #a1a1aa; line-height: 1.6; }
        
        .close-btn {
            background: #4f46e5; padding: 14px 35px; border: none; border-radius: 12px;
            color: white; cursor: pointer; font-weight: bold; font-size: 16px;
            transition: all 0.3s; width: 100%;
        }
        .close-btn:hover { background: #4338ca; transform: translateY(-2px); }

        /* Loader Animation */
        .loader-container { display: flex; justify-content: center; margin-bottom: 25px; }
        .spinner {
            width: 60px; height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="glass-card">
        <h1>مجموعة فيرا</h1>
        <p class="subtitle">استمارة التقييم والانضمام المتقدمة</p>
        
        <form id="veraForm" class="form-grid">
            <div class="input-group">
                <label>الاسم بالكامل</label>
                <input type="text" id="name" placeholder="اكتب اسمك هنا" required>
            </div>

            <div class="input-group">
                <label>العمر</label>
                <input type="number" id="age" placeholder="مثال: 20" required>
            </div>

            <div class="input-group full-width">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>

            <div class="input-group">
                <label>الأكلة المفضلة</label>
                <input type="text" id="food" placeholder="أكلتك المفضلة" required>
            </div>

            <div class="input-group">
                <label>المادة المفضلة</label>
                <input type="text" id="subject" placeholder="مثال: الرياضيات، البرمجة..." required>
            </div>

            <div class="input-group full-width">
                <label>ما هي هوايتك؟</label>
                <input type="text" id="hobby" placeholder="القراءة، الألعاب، السفر..." required>
            </div>

            <!-- الأسئلة الشخصية الجديدة -->
            <div class="input-group">
                <label>هل أنت مستعد للمغامرة؟</label>
                <select id="adventure" required>
                    <option value="" disabled selected>اختر إجابة...</option>
                    <option value="نعم">نعم، بالتأكيد</option>
                    <option value="لا">لا</option>
                </select>
            </div>

            <div class="input-group">
                <label>هل أنت مجتهد؟</label>
                <select id="diligent" required>
                    <option value="" disabled selected>اختر إجابة...</option>
                    <option value="نعم">نعم</option>
                    <option value="لا">لا</option>
                </select>
            </div>

            <div class="input-group">
                <label>هل أنت سريع التفكير؟</label>
                <select id="quick" required>
                    <option value="" disabled selected>اختر إجابة...</option>
                    <option value="نعم">نعم</option>
                    <option value="لا">لا</option>
                </select>
            </div>

            <div class="input-group">
                <label>هل لديك أي أمراض صحية؟</label>
                <select id="health" required>
                    <option value="" disabled selected>اختر إجابة...</option>
                    <option value="نعم">نعم</option>
                    <option value="لا">لا</option>
                </select>
            </div>

            <button type="submit" class="btn" id="submitBtn">إرسال طلب الانضمام</button>
        </form>
    </div>

    <!-- نافذة الانتظار (Waiting Pop-up) -->
    <div class="modal-overlay" id="waitModal">
        <div class="modal-content">
            <div class="loader-container">
                <div class="spinner"></div>
            </div>
            <h2>جاري معالجة طلبك...</h2>
            <p>يرجى الانتظار لحظات، يتم الآن تشفير بياناتك وإرسالها إلى النظام.</p>
        </div>
    </div>

    <!-- نافذة النتيجة (Result Pop-up) -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <h2 id="modalTitle">تنبيه</h2>
            <p id="modalMessage">الرسالة تظهر هنا.</p>
            <button class="close-btn" onclick="closeModal()">حسناً</button>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzfHBc7qm_wRS3xDi0eAnCkCKH5m_AbcmtH34sgLwaDWcGdhNZFcdJ0qXdzY0Yb9lTOVg/exec';

        const form = document.getElementById('veraForm');
        const waitModal = document.getElementById('waitModal');
        const resultModal = document.getElementById('resultModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');

        function closeModal() {
            resultModal.classList.remove('active');
            waitModal.classList.remove('active');
        }

        function showResult(title, message, isError = false) {
            waitModal.classList.remove('active'); // إخفاء نافذة الانتظار
            modalTitle.innerText = title;
            modalTitle.style.color = isError ? '#ef4444' : '#10b981';
            modalMessage.innerText = message;
            resultModal.classList.add('active'); // إظهار نافذة النتيجة
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // إظهار نافذة الانتظار فور الضغط على إرسال
            waitModal.classList.add('active');

            const data = {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                email: document.getElementById('email').value,
                food: document.getElementById('food').value,
                subject: document.getElementById('subject').value,
                hobby: document.getElementById('hobby').value,
                adventure: document.getElementById('adventure').value, // جديد
                diligent: document.getElementById('diligent').value,     // جديد
                quick: document.getElementById('quick').value,           // جديد
                health: document.getElementById('health').value
            };

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                // تأخير بسيط مقصود (ثانية ونصف) لإظهار تأثير المعالجة الفخم
                setTimeout(() => {
                    showResult('تم الاستلام بنجاح! ✨', 'لقد تجاوزت التقييم، تم حفظ إجاباتك المشفرة وسنتواصل معك قريباً.');
                    form.reset();
                }, 1500);

            } catch (error) {
                setTimeout(() => {
                    showResult('خطأ في الاتصال ❌', 'حدث خطأ أثناء الإرسال، تأكد من اتصالك بالإنترنت والمحاولة مجدداً.', true);
                }, 1000);
            }
        });
    </script>
</body>
</html>
